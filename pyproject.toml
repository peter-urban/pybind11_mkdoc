[build-system]
requires = ["flit_core>=3.9"]
build-backend = "flit_core.buildapi"

[project]
name = "pybind11_mkdoc"
description = "Generate documentation bindings for pybind11 modules."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Wenzel Jakob", email = "wenzel.jakob@epfl.ch" }
]
urls.homepage = "https://github.com/pybind/pybind11_mkdoc"
dependencies = []
optional-dependencies.clang = ["clang"]
optional-dependencies.libclang = ["libclang"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Documentation",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Typing :: Typed"
]
dynamic = ["version"]

[dependency-groups]
test = [
    "pytest",
    "pybind11",
]
dev = [{ include-group = "test" }]

[project.scripts]
pybind11-mkdoc = "pybind11_mkdoc:main"


[tool.flit.sdist]
include = ["tests/**/*.py", "tests/**/*.h", ".gitignore"]


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.mypy]
files = ["pybind11_mkdoc"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = "clang.*"
ignore_missing_imports = true


[tool.ruff.lint]
ignore = ["S110", "BLE", "PLW2901", "PLW0603", "INP001"]


# ---------------------------------------------------------------------------
# pixi (conda packaging / development environments)
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge", "themachinethatgoesping"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.pypi-dependencies]
pybind11_mkdoc = { path = ".", editable = true }

[tool.pixi.dependencies]
python = ">=3.9"
flit-core = ">=3.9"
pip = "*"
python-clang = "*"
libclang = "*"
clangdev = "*"
pytest = "*"
pybind11 = "*"

[tool.pixi.feature.build.dependencies]
rattler-build = ">=0.75.0,<0.76"
anaconda-client = ">=1.14.1,<2"

[tool.pixi.feature.build.tasks]
test = "python -m pytest -v tests/"
build-conda = "rattler-build build --recipe recipe/recipe.yaml --output-dir output"

[tool.pixi.environments]
default = { solve-group = "default" }
build = { features = ["build"], solve-group = "default" }
